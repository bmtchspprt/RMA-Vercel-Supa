<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMA Cases — Binmaster</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #222; }
        .top-bar {
            background-color: #800000;
            color: white;
            padding: 0 24px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
        }
        .top-nav { display: flex; align-items: center; gap: 4px; height: 100%; }
        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 0 14px;
            height: 100%;
            display: flex;
            align-items: center;
            opacity: 0.85;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
        }
        .nav-link:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .nav-link.active { opacity: 1; border-bottom: 3px solid white; }
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px 60px; }

        .charts-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 12px;
            color: #800000;
            font-size: 13px;
            font-weight: 600;
        }
        .charts-toggle:hover { opacity: 0.75; }
        .toggle-arrow { display: inline-block; font-size: 11px; transition: transform 0.25s ease; }
        .toggle-arrow.open { transform: rotate(180deg); }
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
            overflow: hidden;
            max-height: 320px;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
            opacity: 1;
        }
        .charts-row.collapsed { max-height: 0; opacity: 0; margin-bottom: 0; }
        .chart-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; }
        .chart-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 16px; }
        .chart-card canvas { max-height: 220px; }
        .stats-box { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; }
        .stats-box h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 16px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-item { background: #f9f9f9; border-radius: 6px; padding: 12px 14px; }
        .stat-item .s-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #888; margin-bottom: 4px; }
        .stat-item .s-value { font-size: 24px; font-weight: 700; color: #222; }
        .stat-item.red .s-value { color: #800000; }
        .stat-item.blue .s-value { color: #1d4ed8; }
        .stat-item.green .s-value { color: #166534; }
        .stat-item.purple .s-value { color: #5b21b6; }

        .table-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-title { font-size: 18px; font-weight: 700; color: #800000; }
        .controls-right { display: flex; align-items: center; gap: 10px; }
        .count { font-size: 13px; color: #666; }
        .view-toggle { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; font-size: 12px; }
        .view-btn { padding: 6px 14px; cursor: pointer; background: white; color: #555; border: none; font-size: 12px; font-weight: 600; }
        .view-btn.active { background: #800000; color: white; }
        .chooser-wrap { position: relative; }
        .col-chooser-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            color: #555;
        }
        .col-chooser-btn:hover { border-color: #800000; color: #800000; }
        .col-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
            width: 260px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .col-dropdown.open { display: block; }
        .col-dropdown h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 10px; }
        .col-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .col-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #333; cursor: pointer; padding: 3px 0; }
        .col-item input { cursor: pointer; accent-color: #800000; }
        .col-dropdown-footer { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; display: flex; gap: 8px; }
        .col-dropdown-footer button { flex: 1; padding: 5px; font-size: 11px; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; background: white; }
        .col-dropdown-footer button.apply { background: #800000; color: white; border-color: #800000; }

        .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .filters input, .filters select { padding: 7px 11px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; background: white; }
        .filters input { width: 220px; }

        .section-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #800000;
            margin: 24px 0 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #800000;
        }
        .section-label.completed { color: #166534; border-bottom-color: #166534; }

        .table-wrap { overflow-x: auto; margin-bottom: 8px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            table-layout: fixed;
        }

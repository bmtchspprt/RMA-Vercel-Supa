<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMA Cases — Binmaster</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #222; }
        .top-bar {
            background-color: #800000;
            color: white;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top-bar a { color: white; font-size: 13px; font-weight: normal; text-decoration: none; opacity: 0.8; }
        .top-bar a:hover { opacity: 1; }
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px 60px; }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .page-title { font-size: 22px; font-weight: 700; color: #800000; }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            padding: 7px 11px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }
        .filters input { width: 220px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            font-size: 13px;
        }
        thead { background: #800000; color: white; }
        th {
            padding: 11px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fdf8f8; }
        .status-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-Submitted { background: #dbeafe; color: #1d4ed8; }
        .status-Received { background: #fef9c3; color: #854d0e; }
        .status-Evaluation { background: #ede9fe; color: #5b21b6; }
        .status-Credited { background: #dcfce7; color: #166534; }
        .status-Replaced { background: #d1fae5; color: #065f46; }
        .doc-link {
            color: #800000;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
        }
        .doc-link:hover { text-decoration: underline; }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 14px;
        }
        .count { font-size: 13px; color: #666; }
        .edit-btn {
            background: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            color: #555;
        }
        .edit-btn:hover { border-color: #800000; color: #800000; }
    </style>
</head>
<body>

<div class="top-bar">
    Binmaster Support Platform — RMA Cases
    <a href="/index.html">← Back to Dashboard</a>
</div>

<div class="container">
    <div class="page-header">
        <div class="page-title">All RMA Cases</div>
        <div class="count" id="case-count">Loading...</div>
    </div>

    <div class="filters">
        <input type="text" id="search" placeholder="Search name, email, company..." oninput="filterTable()" />
        <select id="filter-status" onchange="filterTable()">
            <option value="">All Statuses</option>
            <option>Submitted</option>
            <option>Received</option>
            <option>Evaluation</option>
            <option>Credited</option>
            <option>Replaced</option>
        </select>
        <select id="filter-product" onchange="filterTable()">
            <option value="">All Products</option>
            <option>NCR</option>
            <option>CNCR</option>
            <option>SmartBob</option>
            <option>Rotary</option>
            <option>Probe</option>
            <option>Vibrating Rod</option>
            <option>Senix</option>
            <option>Gateway</option>
            <option>C100</option>
            <option>DPM</option>
            <option>Loadcell</option>
            <option>Other</option>
        </select>
    </div>

    <table id="rma-table">
        <thead>
            <tr>
                <th>Case #</th>
                <th>Date</th>
                <th>Name</th>
                <th>Company</th>
                <th>Product</th>
                <th>Issue Type</th>
                <th>Status</th>
                <th>Doc #</th>
                <th>File</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="10" class="no-data">Loading cases...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://dlzpyrcskcvlsdtgwfko.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsenB5cmNza2N2bHNkdGd3ZmtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NDY1ODIsImV4cCI6MjA5MzQyMjU4Mn0.kOPX8Wbu0XdRVSc81NpIS2TdwIzaJOMRX_9BeSdbQWI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allCases = [];

    async function loadCases() {
        const { data, error } = await supabaseClient
            .from('rma_cases')
            .select('*')
            .order('date_created', { ascending: false });

        if (error) {
            document.getElementById('table-body').innerHTML =
                `<tr><td colspan="10" class="no-data">Error loading cases: ${error.message}</td></tr>`;
            return;
        }

        allCases = data;
        renderTable(allCases);
    }

    function getFileUrl(path) {
        if (!path) return null;
        return `${SUPABASE_URL}/storage/v1/object/public/rma-documents/${path}`;
    }

    function formatDate(ts) {
        if (!ts) return '-';
        return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderTable(cases) {
        const tbody = document.getElementById('table-body');
        document.getElementById('case-count').textContent = `${cases.length} case${cases.length !== 1 ? 's' : ''}`;

        if (cases.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="no-data">No cases found.</td></tr>';
            return;
        }

        tbody.innerHTML = cases.map(c => `
            <tr>
                <td><strong>${c.case_number || '-'}</strong></td>
                <td>${formatDate(c.date_created)}</td>
                <td>${c.contact_name || '-'}<br><span style="color:#888;font-size:11px;">${c.email || ''}</span></td>
                <td>${c.company || '-'}</td>
                <td>${c.product_name || '-'}</td>
                <td>${c.issue_type || '-'}</td>
                <td><span class="status-badge status-${c.status}">${c.status || 'Submitted'}</span></td>
                <td>${c.document_number || '-'}</td>
                <td>${c.attached_documents
                    ? `<a class="doc-link" href="${getFileUrl(c.attached_documents)}" target="_blank">View File</a>`
                    : '-'}</td>
                <td><button class="edit-btn" onclick="viewCase('${c.id}')">View</button></td>
            </tr>
        `).join('');
    }

    function filterTable() {
        const search = document.getElementById('search').value.toLowerCase();
        const status = document.getElementById('filter-status').value;
        const product = document.getElementById('filter-product').value;

        const filtered = allCases.filter(c => {
            const matchSearch = !search ||
                (c.contact_name || '').toLowerCase().includes(search) ||
                (c.email || '').toLowerCase().includes(search) ||
                (c.company || '').toLowerCase().includes(search) ||
                (c.case_number || '').toLowerCase().includes(search);
            const matchStatus = !status || c.status === status;
            const matchProduct = !product || c.product_name === product;
            return matchSearch && matchStatus && matchProduct;
        });

        renderTable(filtered);
    }

    function viewCase(id) {
        window.location.href = `/admin/rma-case.html?id=${id}`;
    }

    loadCases();
</script>

</body>
</html>

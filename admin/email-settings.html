<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Binmaster</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #222; font-size: 13px; }
        .top-bar {
            background-color: #800000;
            color: white;
            padding: 0 24px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
        }
        .top-nav { display: flex; align-items: center; gap: 4px; height: 100%; }
        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 0 14px;
            height: 100%;
            display: flex;
            align-items: center;
            opacity: 0.85;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
        }
        .nav-link:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .nav-link.active { opacity: 1; border-bottom: 3px solid white; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px 60px; }
        .page-title { font-size: 20px; font-weight: 700; color: #800000; margin-bottom: 4px; }
        .page-sub { font-size: 13px; color: #666; margin-bottom: 28px; }

        .section-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; }
        .section-card h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #800000; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; }

        /* Tabs for Settings sections */
        .settings-tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
        .settings-tab {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: white;
            border: 1px solid #e0e0e0;
            color: #666;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .settings-tab.active { background: #800000; color: white; border-color: #800000; }
        .settings-tab:hover:not(.active) { border-color: #800000; color: #800000; }
        .settings-section { display: none; }
        .settings-section.active { display: block; }

        /* IO buttons */
        .io-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .io-btn { padding: 8px 16px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid #ccc; background: white; color: #333; transition: all 0.15s; }
        .io-btn:hover { border-color: #800000; color: #800000; }
        .io-btn.primary { background: #800000; color: white; border-color: #800000; }
        .io-btn.primary:hover { background: #600000; }
        .io-btn.danger { color: #dc2626; border-color: #fca5a5; }
        .io-btn.danger:hover { background: #dc2626; color: white; border-color: #dc2626; }
        .io-btn.small { padding: 4px 10px; font-size: 11px; }
        .io-divider { width: 1px; height: 24px; background: #e0e0e0; }
        .io-status { font-size: 12px; color: #666; }
        .io-status.success { color: #16a34a; }
        .io-status.error { color: #dc2626; }
        #upload-input { display: none; }

        /* Fields */
        .field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .field-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; }
        input[type=text], input[type=email], input[type=url], input[type=number], textarea, select {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 7px 10px;
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: #222;
            background: white;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #800000; }
        textarea { resize: vertical; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        /* Media Library */
        .media-upload-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .media-upload-zone:hover, .media-upload-zone.dragover { border-color: #800000; background: #fff5f5; }
        .media-upload-zone p { font-size: 13px; color: #888; margin-bottom: 6px; }
        .media-upload-zone .upload-hint { font-size: 11px; color: #aaa; }
        #media-file-input { display: none; }
        .media-upload-btn {
            display: inline-block;
            padding: 8px 20px;
            background: #800000;
            color: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        .media-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            position: relative;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .media-item:hover { border-color: #800000; }
        .media-item.selected { border-color: #800000; border-width: 2px; }
        .media-item img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            background: #f9f9f9;
            display: block;
        }
        .media-item-footer {
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }
        .media-item-name {
            font-size: 10px;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .media-item-delete {
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            flex-shrink: 0;
            padding: 2px;
        }
        .media-item-delete:hover { color: #dc2626; }
        .media-item-copy {
            font-size: 10px;
            color: #800000;
            cursor: pointer;
            flex-shrink: 0;
            font-weight: 600;
        }
        .media-item-copy:hover { text-decoration: underline; }
        .media-empty { font-size: 13px; color: #aaa; text-align: center; padding: 20px; }
        .media-progress { font-size: 12px; color: #800000; margin-top: 8px; }

        /* Product Manager */
        .product-manager-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .pm-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; background: #fafafa; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .pm-item img { width: 56px; height: 56px; object-fit: contain; border-radius: 4px; }
        .pm-img-placeholder { width: 56px; height: 56px; background: #f0f0f0; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .pm-name { font-size: 13px; font-weight: 600; color: #222; text-align: center; }
        .pm-link { font-size: 11px; color: #1d4ed8; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .pm-actions { display: flex; gap: 6px; }
        .pm-inactive { opacity: 0.4; }

        /* Image picker for product form */
        .img-picker-row { display: flex; gap: 10px; align-items: flex-end; }
        .img-picker-row input { flex: 1; }
        .img-picker-btn {
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            white-space: nowrap;
            color: #555;
            flex-shrink: 0;
        }
        .img-picker-btn:hover { border-color: #800000; color: #800000; }
        .img-preview { width: 50px; height: 50px; object-fit: contain; border: 1px solid #e0e0e0; border-radius: 4px; background: #f9f9f9; flex-shrink: 0; }

        /* Add product form */
        .add-form { border: 1.5px dashed #ccc; border-radius: 8px; padding: 20px; background: #fafafa; }
        .add-form h4 { font-size: 13px; font-weight: 700; color: #800000; margin-bottom: 14px; }
        .add-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Email templates */
        .vars-box { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 14px 16px; margin-bottom: 20px; }
        .vars-box h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 10px; }
        .vars-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .var-pill { background: #800000; color: white; font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer; font-family: monospace; user-select: none; }
        .var-pill:hover { background: #600000; }
        .var-hint { font-size: 11px; color: #aaa; margin-top: 6px; }
        .email-tabs { display: flex; gap: 0; border-bottom: 2px solid #800000; }
        .email-tab { padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; background: white; border: 1px solid #e0e0e0; border-bottom: none; color: #666; border-radius: 6px 6px 0 0; margin-right: 4px; transition: all 0.15s; }
        .email-tab.active { background: #800000; color: white; border-color: #800000; }
        .email-tab:hover:not(.active) { background: #f9f9f9; color: #800000; }
        .template-card { background: white; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 8px 8px; padding: 20px 24px; margin-bottom: 20px; }
        .action-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
